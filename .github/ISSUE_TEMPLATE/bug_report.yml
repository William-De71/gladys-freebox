name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: gladys
    attributes:
      label: Gladys version
      placeholder: 4.x / 5.x
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Integration version
      description: Integrations → Freebox, or the Supervision page.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Logs of the integration container, ideally with the environment variable
        DEBUG=gladys-integration-sdk, and the model of your Freebox (Server and Player)
        (Freebox OS → Settings → System), and of the device involved
        (sensor, shutter, camera, Player). Remove the app token and camera URLs first.
      render: text
