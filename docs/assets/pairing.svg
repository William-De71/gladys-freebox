<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pairing Gladys with the Freebox in four steps</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Step 1: Gladys button -->
  <circle cx="44" cy="44" r="14" fill="#0969da"/>
  <text x="44" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="66" y="49" font-size="14" font-weight="600" fill="#24292f">In Gladys</text>
  <rect x="30" y="75" width="180" height="150" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="120" y="102" text-anchor="middle" font-size="12" fill="#57606a">Freebox › Configuration</text>
  <rect x="48" y="118" width="144" height="34" rx="6" fill="#0969da"/>
  <text x="120" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Pair with the Freebox</text>
  <rect x="48" y="162" width="144" height="26" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="120" y="179" text-anchor="middle" font-size="11" fill="#57606a">Test the connection</text>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="#57606a">stand next to the box first</text>

  <line x1="214" y1="150" x2="244" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: LCD -->
  <circle cx="264" cy="44" r="14" fill="#0969da"/>
  <text x="264" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="286" y="49" font-size="14" font-weight="600" fill="#24292f">On the Freebox Server</text>
  <rect x="250" y="75" width="190" height="150" rx="12" fill="#24292f"/>
  <rect x="266" y="91" width="158" height="74" rx="4" fill="#0d1117" stroke="#3fb950"/>
  <text x="345" y="114" text-anchor="middle" font-size="11" fill="#3fb950" font-family="ui-monospace, Menlo, monospace">Autoriser l'application</text>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#3fb950" font-family="ui-monospace, Menlo, monospace">Gladys Assistant ?</text>
  <text x="290" y="152" font-size="11" fill="#3fb950" font-family="ui-monospace, Menlo, monospace">Non</text>
  <text x="400" y="152" text-anchor="end" font-size="11" fill="#3fb950" font-family="ui-monospace, Menlo, monospace">Oui ▶</text>
  <circle cx="390" cy="194" r="16" fill="#3fb950"/>
  <path d="M384,186 L398,194 L384,202 z" fill="#0d1117"/>
  <text x="300" y="199" text-anchor="middle" font-size="11" fill="#ffffff">press ▶</text>
  <text x="345" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#cf222e">within about 55 seconds</text>

  <line x1="444" y1="150" x2="474" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: permissions -->
  <circle cx="494" cy="44" r="14" fill="#0969da"/>
  <text x="494" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="516" y="49" font-size="14" font-weight="600" fill="#24292f">In Freebox OS</text>
  <rect x="480" y="75" width="190" height="150" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="575" y="99" text-anchor="middle" font-size="11" fill="#57606a">Access management › Applications</text>
  <g font-size="12" fill="#24292f">
    <rect x="496" y="113" width="14" height="14" rx="3" fill="#1a7f37"/>
    <path d="M499,120 L502,124 L508,116" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="518" y="125">Home automation</text>
    <rect x="496" y="137" width="14" height="14" rx="3" fill="#1a7f37"/>
    <path d="M499,144 L502,148 L508,140" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="518" y="149">Camera</text>
    <rect x="496" y="161" width="14" height="14" rx="3" fill="#1a7f37"/>
    <path d="M499,168 L502,172 L508,164" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="518" y="173">Player control</text>
    <rect x="496" y="185" width="14" height="14" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="518" y="197" fill="#57606a">Settings (reboot only)</text>
  </g>
  <text x="575" y="248" text-anchor="middle" font-size="12" fill="#57606a">no box ticked = no device found</text>

  <line x1="674" y1="150" x2="704" y2="150" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: scan -->
  <circle cx="724" cy="44" r="14" fill="#0969da"/>
  <text x="724" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="746" y="49" font-size="14" font-weight="600" fill="#24292f">Back in Gladys</text>
  <rect x="710" y="75" width="145" height="150" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="782" y="99" text-anchor="middle" font-size="11" fill="#57606a">Discover › Scan</text>
  <g font-size="11" fill="#24292f">
    <rect x="722" y="110" width="121" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="732" y="126">Volet salon</text>
    <rect x="722" y="140" width="121" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="732" y="156">Détecteur entrée</text>
    <rect x="722" y="170" width="121" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="732" y="186">Freebox Player</text>
  </g>
  <text x="782" y="212" text-anchor="middle" font-size="11" fill="#57606a">pick what to create</text>

  <!-- footer -->
  <rect x="30" y="272" width="825" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="442" y="296" text-anchor="middle" font-size="12" fill="#24292f">Done once: the app token is stored in the Gladys config and reused on every restart. "Unpair" forgets it.</text>
</svg>
