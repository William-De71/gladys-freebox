<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="vendor/theme/package/dashboard.css" />
    <link rel="stylesheet" href="widget.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <style>
      body {
        background: #f5f7fb;
        padding: 24px;
      }
      #row {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .col {
        width: 380px;
        flex: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .card {
        margin-bottom: 0;
      }
    </style>
    <script src="vendor/apexcharts/package/dist/apexcharts.min.js"></script>
    <script src="data.js"></script>
  </head>
  <body>
    <div id="row"></div>
    <script>
      if (new URLSearchParams(location.search).get('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
    </script>
    <script src="render.js"></script>
  </body>
</html>
